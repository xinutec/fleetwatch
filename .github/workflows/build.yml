---
name: build

# fleetwatch (Rust backend + Angular frontend) — gate on clippy + cargo test and
# the frontend's angular-eslint + unit tests + prod build, then build and push the
# single image xinutec/fleetwatch:latest to Docker Hub. The k8s manifests + deploy
# live in the home monorepo (xinutec/pippijn code/kubes/fleetwatch/k8s); the image
# tag is the only contract between this repo and the deploy.
on:
  push:
    branches: [main]
    # Images build from rust:1-bookworm / node:24-alpine, never the flake, so a
    # flake.lock-only change can't affect the image — skip the rebuild.
    paths-ignore:
      - "**/flake.lock"
  workflow_dispatch: {}

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    container: rust:1-bookworm
    # A throwaway MariaDB so the DB round-trip tests actually run (they migrate +
    # exercise the real queries; they skip when the env var is unset locally).
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: fleetwatch_test
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      FLEETWATCH_TEST_DATABASE_URL: mysql://root:root@mariadb:3306/fleetwatch_test
    steps:
      - uses: actions/checkout@v6
      - run: rustup component add clippy
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test -- --test-threads=1
      # The committed TS types + golden wire fixture must match the Rust types.
      # gate.dhall gates this locally via the pre-commit hook, but a clone
      # without hooks could push drift — without this step CI would merge it.
      #
      # Deliberately NOT `scripts/gen-types.sh`, which this step used to call:
      # that wrapper is `nix run ../dev-lint#gen-types` now, and a runner has
      # neither nix nor the private sibling repo. Same reason dev-lint itself
      # runs in no workflow in the fleet. What it does — generate into a clean
      # directory, install only on success — is spelled out here instead, and
      # `mv` is what makes a REMOVED Rust type fail rather than linger as a
      # committed file nothing generates any more.
      #
      # Plain file diffs, NOT `git diff`: in container jobs the index is written
      # by the runner's mounted (newer) git and read here by the image's older
      # one, which misreports a clean regeneration as wholesale deletions
      # (observed 2026-07-16). Copies of the committed files need no index.
      #
      # TS_RS_EXPORT_DIR comes from .cargo/config.toml, so `cargo test export_`
      # writes the bindings back into frontend/src/app/generated; the golden
      # fixture resolves its own path and writes tests/golden in place.
      - run: |
          mv frontend/src/app/generated /tmp/committed-generated
          cp tests/golden/problems.json /tmp/committed-problems.json
          cargo test export_
          diff -ru /tmp/committed-generated frontend/src/app/generated
          diff -u /tmp/committed-problems.json tests/golden/problems.json

  fe-verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      # Before setup-node, whose `cache: pnpm` shells out to `pnpm store path`.
      # The major floats: pinning it would be a second version held level with
      # the flake's by hand, and the lockfile is what has to match.
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm exec ng build --configuration production

  image:
    needs: [verify, fe-verify]
    # Docker Hub auth comes from repo secrets; the GITHUB_TOKEN only reads.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # ONLY :latest — never version/sha tags. A rollback is a new image
          # built from rolled-forward fixes on main, not an old tag re-pinned;
          # "what is running?" is answered by the build sha the app surfaces.
          tags: xinutec/fleetwatch:latest
          # Commit stamp for the build-version the app surfaces (Dockerfile ARG).
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=registry,ref=xinutec/fleetwatch:cache
          cache-to: type=registry,ref=xinutec/fleetwatch:cache
