<div class="main">
  <!-- The bar every app draws (`@xinutec/ui-scaffold`): the app's name at the root
       and on Problems, an arrow up and the screen's name on a report or a history. -->
  <ui-scaffold title="Fleetwatch">
    <span class="build tnum" title="running build">{{ build.sha }}</span>
  </ui-scaffold>

  <main class="content">
    <router-outlet />
  </main>
</div>

<nav class="nav" aria-label="Sections">
  @for (t of tabs(); track t.path) {
    <a
      class="tab"
      [routerLink]="t.path"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: t.exact }"
    >
      <mat-icon
        aria-hidden="true"
        [matBadge]="problemCount()"
        [matBadgeHidden]="t.label !== 'Problems' || problemCount() === 0"
        matBadgeColor="warn"
        matBadgeSize="small"
      >
        {{ t.icon }}
      </mat-icon>
      <span>{{ t.label }}</span>
    </a>
  }
</nav>
